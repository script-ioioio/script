  if(d.m)h+=`<div class="lbl">${u.msg}</div>`+d.m.map((m,i)=>msgH(m[0],e.m[i][1],m[1])).join("");
  if(d.n)h+=`<div class="lbl">${u.cmp}</div><div class="note">${esc(d.n)}</div>`;
  if(d.r)h+=`<div class="lbl">${u.rep}</div>`+d.r.map((r,i)=>{const ins=e.r[i][2];return `<div class="guest">${u.says} <b>${esc(r[0])}</b></div>`+(ins?`<div class="note">${u.instr}: ${esc(r[1])}</div>`:msgH(u.reply,e.r[i][1],r[1]))}).join("");
  h+=`<div class="lbl">${u.nx}</div><div>${esc(d.x)}</div>`;
  if(s.rel)h+=`<div class="lbl">${u.rel}</div><div class="chips">${s.rel.map(i=>byId[i]?`<a href="#${i}" data-id="${i}">${esc(D(byId[i]).t)}</a>`:"").join("")}</div>`;
  if(s.sec==="crm")h+=`<div class="lbl">${u.flow}</div><div class="flow">${FLOW.map((f,i)=>`${i?"<i>→</i>":""}<span>${f}</span>`).join("")}</div>`;
  return h+"</div>";
}
function render(){
  const u=UI.ru,q=query.trim().toLowerCase();
  $("#q").placeholder=u.ph;document.documentElement.lang=lang;
  $("#roles").innerHTML=["a","m","h"].map(k=>`<button data-r="${k}" class="${k===role?"on":""}">${u[k]}</button>`).join("");
  document.querySelectorAll("#langs button").forEach(b=>b.classList.toggle("on",b.dataset.l===lang));
  const items=S.filter(s=>roleOk(s)&&(!q||hay[s.id].includes(q)));
  const a=s=>`<a href="#${s.id}" data-id="${s.id}" class="${s.id===cur?"on":""}"><span>${esc(D(s).t)}</span><small>${s.role==="a"?"":s.role.toUpperCase()}</small></a>`;
  let h="";
  if(q)h=`<h4>${u.found}${items.length}</h4>`+items.map(a).join("");
  else SECTIONS.forEach(([id])=>{const g=items.filter(s=>s.sec===id);if(g.length)h+=`<h4>${secName(id)}</h4>`+g.map(a).join("")});
  $("#list").innerHTML=h||`<div class="empty">${u.none}</div>`;
  $("#main").innerHTML=view(byId[cur]);
}
function go(id){cur=id;history.replaceState(null,"","#"+id);document.body.classList.remove("open");render();$("#main").scrollTop=0}
document.addEventListener("click",e=>{
  const c=e.target.closest(".cp");if(c){copy(c.dataset.c,c);return}
  const i=e.target.closest("[data-id]");if(i){e.preventDefault();go(i.dataset.id);return}
  const r=e.target.closest("[data-r]");if(r){role=r.dataset.r;st.set("role",role);render();return}
  const l=e.target.closest("[data-l]");if(l){lang=l.dataset.l;st.set("lang",lang);render();return}
  if(e.target.closest("#menu"))document.body.classList.toggle("open");
});
$("#q").addEventListener("input",e=>{query=e.target.value;render()});
$("#q").addEventListener("keydown",e=>{if(e.key==="Enter"){const f=$("#list a");if(f)go(f.dataset.id)}if(e.key==="Escape"){e.target.value="";query="";render()}});
document.addEventListener("keydown",e=>{if(e.key==="/"&&document.activeElement.id!=="q"){e.preventDefault();$("#q").focus()}});
render();
</script>
</body>
</html>
