<style>
:root{--bg:#16171a;--panel:#1d1f23;--card:#22252a;--line:#32363d;--tx:#e8e9ec;--mut:#9aa0aa;--ac:#c9a7ff;--acbg:#2b2438;--ok:#6fcf97;--msg:#1a1c20}
@media (prefers-color-scheme:light){:root{--bg:#f4f4f6;--panel:#fff;--card:#fff;--line:#dcdde2;--tx:#1b1c20;--mut:#60646d;--ac:#6b3fc4;--acbg:#efe9fb;--ok:#1e8a4c;--msg:#f4f4f6}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;gap:12px;align-items:center;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.04em;white-space:nowrap}
#q{flex:1;min-width:180px;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:inherit}
#q:focus,button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.roles{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.roles button{border:0;background:none;color:var(--mut);padding:8px 12px;font:inherit;cursor:pointer}
.roles button.on{background:var(--acbg);color:var(--ac);font-weight:600}
.wrap{display:flex;min-height:calc(100% - 58px)}
nav{width:250px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:10px;overflow:auto;position:sticky;top:58px;height:calc(100vh - 58px)}
nav a{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:7px;color:var(--mut);text-decoration:none}
nav a:hover{background:var(--bg)}
nav a.on{background:var(--acbg);color:var(--ac);font-weight:600}
nav small{opacity:.7}
main{flex:1;padding:20px;max-width:880px;width:100%}
main h2{margin:0 0 4px;font-size:21px}
.sub{color:var(--mut);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.card h3{margin:0 0 4px;font-size:17px}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mut);margin-left:6px;vertical-align:middle}
.lbl{font-size:13px;font-weight:600;color:var(--mut);margin:14px 0 6px}
.guest{border-left:3px solid var(--ac);padding:2px 10px;color:var(--mut);font-style:italic;margin:8px 0}
.msg{background:var(--msg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:6px 0}
.msg .t{white-space:pre-wrap;overflow-wrap:anywhere}
.msg .h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;font-size:13px;color:var(--mut)}
.cp{border:1px solid var(--ac);background:none;color:var(--ac);border-radius:6px;padding:4px 12px;font:inherit;font-size:13px;cursor:pointer;flex:none}
.cp:hover,.cp.done{background:var(--ac);color:var(--bg)}
.ph{color:var(--ac);font-weight:600}
details{border:1px solid var(--line);border-radius:8px;margin:6px 0;padding:0 12px}
details[open]{padding-bottom:8px}
summary{cursor:pointer;padding:9px 0;font-weight:600}
ul{margin:4px 0;padding-left:20px}
.rel a{display:inline-block;margin:2px 6px 2px 0;padding:3px 10px;border:1px solid var(--line);border-radius:99px;color:var(--ac);text-decoration:none;font-size:13px}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:16px}
.flow span{padding:5px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);font-size:13px}
.flow i{color:var(--mut);font-style:normal}
.empty{color:var(--mut);padding:30px 0;text-align:center}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ok);color:#fff;padding:8px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .15s;z-index:9}
#toast.on{opacity:1}
@media(max-width:760px){.wrap{display:block}nav{width:auto;height:auto;position:static;display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px}nav a{white-space:nowrap}main{padding:14px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* ===== ЛОГИКА ===== */
const $=s=>document.querySelector(s);
const esc=t=>t.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const hl=t=>esc(t).replace(/\[[^\]]+\]/g,m=>`<span class="ph">${m}</span>`);
const RN={a:"Все",m:"Менеджер",h:"Хостес"};
let role="a",sec=location.hash.slice(1)||"start",query="";
const byId=Object.fromEntries(S.map(s=>[s.id,s]));
const text=s=>[s.title,s.when,s.guest,s.note,s.next,(s.list||[]).join(" "),(s.msgs||[]).map(m=>m.join(" ")).join(" "),(s.replies||[]).map(m=>m[0]+" "+m[1]).join(" ")].join(" ").toLowerCase();
const roleOk=s=>role==="a"||s.role==="a"||s.role===role;
function copy(t,btn){
  const done=()=>{btn.classList.add("done");btn.textContent="Скопировано ✓";const x=$("#toast");x.classList.add("on");setTimeout(()=>{x.classList.remove("on");btn.classList.remove("done");btn.textContent="Копировать"},1400)};
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(done,fb);else fb();
  function fb(){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(e){}a.remove();done()}
}
const msgH=(l,t,k)=>`<div class="msg"><div class="h"><span>${esc(l)}</span>${k?"":`<button class="cp" data-c="${esc(t).replace(/"/g,"&quot;")}">Копировать</button>`}</div><div class="t">${hl(t)}</div></div>`;
function card(s){
  let h=`<article class="card" id="s-${s.id}"><h3>${esc(s.title)}<span class="tag">${RN[s.role]}</span></h3>`;
  if(s.guest)h+=`<div class="lbl">Реплика гостя</div><div class="guest">${esc(s.guest)}</div>`;
  h+=`<div class="lbl">${s.guest?"Цель ответа":"Когда использовать"}</div><div>${esc(s.when)}</div>`;
  if(s.list)h+=`<ul>${s.list.map(i=>`<li>${esc(i)}</li>`).join("")}</ul>`;
  if(s.msgs)h+=`<div class="lbl">${s.guest?"Готовый ответ":"Текст сообщения"}</div>`+s.msgs.map(m=>msgH(m[0],m[1])).join("");
  if(s.note)h+=`<div class="lbl">Сравнение</div><div>${esc(s.note)}</div>`;
  if(s.replies)h+=`<div class="lbl">Если гость отвечает…</div>`+s.replies.map(r=>`<details><summary>${esc(r[0])}</summary>${msgH("Ответ",r[1],r[2])}</details>`).join("");
  h+=`<div class="lbl">Следующий шаг</div><div>${esc(s.next)}</div>`;
  if(s.rel)h+=`<div class="lbl">Связанные скрипты</div><div class="rel">${s.rel.map(i=>byId[i]?`<a href="#${byId[i].sec}" data-go="${i}">${esc(byId[i].title)}</a>`:"").join("")}</div>`;
  return h+"</article>";
}
function render(){
  const q=query.trim().toLowerCase();
  $("#nav").innerHTML=SECTIONS.map(([id,n])=>`<a href="#${id}" data-sec="${id}" class="${!q&&id===sec?"on":""}">${n}<small>${S.filter(s=>s.sec===id&&roleOk(s)).length}</small></a>`).join("");
  let list=S.filter(roleOk),title,sub="";
  if(q){list=list.filter(s=>text(s).includes(q));title=`Поиск: «${esc(query)}»`;sub=`Найдено: ${list.length}`}
  else{list=list.filter(s=>s.sec===sec);title=(SECTIONS.find(x=>x[0]===sec)||SECTIONS[0])[1]}
  let h=`<h2>${title}</h2><p class="sub">${sub}</p>`;
  if(!q&&sec==="crm")h+=`<div class="flow">${FLOW.map((f,i)=>`${i?"<i>→</i>":""}<span>${f}</span>`).join("")}</div>`;
  h+=list.length?list.map(card).join(""):`<div class="empty">Ничего не найдено. Измените запрос или роль.</div>`;
  $("#main").innerHTML=h;
}
$("#roles").innerHTML=Object.entries({a:"Все",m:"Менеджер",h:"Хостес"}).map(([k,v])=>`<button data-r="${k}" class="${k==="a"?"on":""}">${v}</button>`).join("");
document.addEventListener("click",e=>{
  const c=e.target.closest(".cp");if(c){copy(c.dataset.c,c);return}
  const r=e.target.closest("[data-r]");if(r){role=r.dataset.r;document.querySelectorAll("[data-r]").forEach(b=>b.classList.toggle("on",b===r));render();return}
  const n=e.target.closest("[data-sec]");if(n){e.preventDefault();sec=n.dataset.sec;query="";$("#q").value="";location.hash=sec;render();scrollTo(0,0);return}
  const g=e.target.closest("[data-go]");if(g){e.preventDefault();const s=byId[g.dataset.go];sec=s.sec;query="";$("#q").value="";location.hash=sec;render();const el=document.getElementById("s-"+s.id);if(el){el.scrollIntoView();el.style.outline="2px solid var(--ac)";setTimeout(()=>el.style.outline="",1600)}}
});
$("#q").addEventListener("input",e=>{query=e.target.value;render()});
addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(SECTIONS.some(x=>x[0]===h)){sec=h;render()}});
render();
</script>
</body>
</html>
